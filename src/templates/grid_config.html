<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Grid Configuration</title>
    <style>
        .disabled-field {
            background-color: #f0f0f0;
        }
        #startButton {
            font-size: 20px;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: lightgray;
            color: black;
            border: none;
            cursor: pointer;
        }
        #startButton.active {
            background-color: green;
        }
        #startButton.inactive {
            background-color: red;
        }
    </style>
</head>
<body>
<h1>Set Grid Configuration</h1>

<form id="config-form" onsubmit="submitConfig(); return false;">
    <label for="symbol">Trading Pair:</label>
    <input type="text" id="symbol" name="symbol" value="{{ config.symbol }}" required><br><br>

    <label for="min_price">Min Price:</label>
    <input type="number" id="min_price" name="min_price" value="{{ config.min_price }}" required><br><br>

    <label for="max_price">Max Price:</label>
    <input type="number" id="max_price" name="max_price" value="{{ config.max_price }}" required><br><br>

    <label for="num_grids">Number of Grids:</label>
    <input type="number" id="num_grids" name="num_grids" value="{{ config.num_grids }}" required><br><br>

    <label for="max_position">Max Position:</label>
    <input type="number" id="max_position" name="max_position" value="{{ config.max_position }}" required><br><br>

    <label for="fixed_trade_amount">Fixed Trade Amount (ETH):</label>
    <input type="number" id="fixed_trade_amount" name="fixed_trade_amount" value="{{ config.fixed_trade_amount }}" required step="any"><br><br>

    <label for="security_deposit">Security Deposit:</label>
    <input type="number" id="security_deposit" name="security_deposit" value="{{ config.security_deposit }}" required><br><br>

    <label for="starting_price">Starting Price (USD):</label>
    <input type="number" id="starting_price" name="starting_price" value="{{ config.starting_price }}" required step="any"><br><br>

    <button type="submit" id="submitButton">Submit</button>
</form>

<button id="startButton" class="inactive" onclick="startAutoTrading()" disabled>Start Auto Trading</button>

<script>
    let tradingActive = false;

    async function submitConfig() {
        // Disable form fields
        disableFormFields(true);

        // Disable the submit button
        document.getElementById("submitButton").disabled = true;

        // Enable and change the style of the "Start" button
        const startButton = document.getElementById("startButton");
        startButton.disabled = false;
        startButton.classList.remove('inactive');
        startButton.classList.add('active');

        // Collect form data
        const formData = new FormData(document.getElementById('config-form'));
        const configData = Object.fromEntries(formData.entries());

        // Debugging: Log the collected form data
        // console.log("Collected form data: ", configData);

        try {
            const response = await fetch('/config_grid', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    // Debugging: Log the headers being sent
                    // 'Debug-Log': 'Sending JSON data'
                },
                body: JSON.stringify(configData)  // Convert form data to JSON
            });

            // Debugging: Log the status of the response
            console.log('Response status:', response.status);

            const data = await response.json();

            // Debugging: Log the response data
            console.log('Response from server:', data);

            alert(data.message || 'Configuration submitted successfully!');
        } catch (error) {
            console.error('Error:', error);
            alert('Error submitting configuration: ' + error.message);
        }
    }

    function disableFormFields(disable) {
        const fields = ['symbol', 'min_price', 'max_price', 'num_grids', 'max_position', 'fixed_trade_amount', 'starting_price', 'security_deposit'];
        fields.forEach(field => {
            document.getElementById(field).disabled = disable;
        });
    }

    async function startAutoTrading() {
        const startButton = document.getElementById("startButton");
        console.log('Button clicked. Current state:', tradingActive);

        try {
            const url = tradingActive ? '/stop_trading' : '/start_trading';
            const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' } });

            if (!response.ok) {
                throw new Error(tradingActive ? 'Failed to stop trading' : 'Failed to start trading');
            }

            const data = await response.json();
            alert(data.message || (tradingActive ? 'Auto trading stopped!' : 'Auto trading started!'));

            // Update button state
            if (tradingActive) {
                startButton.innerText = "Start Auto Trading";
                startButton.style.backgroundColor = "green";
                startButton.classList.remove('active');
                startButton.classList.add('inactive');
            } else {
                startButton.innerText = "Stop Auto Trading";
                startButton.style.backgroundColor = "red";
                startButton.classList.remove('inactive');
                startButton.classList.add('active');
            }
            tradingActive = !tradingActive;  // Toggle trading state
        } catch (error) {
            console.error('Error:', error);
            alert('Error during auto trading: ' + error.message);
        }
    }

</script>

<a href="{{ url_for('main.home') }}">Back to Home</a>

</body>
</html>
